# Cấu hình mặc định cho mọi job nộp qua spark/submit.sh (README-2A mục 9).
# Từng job có thể ghi đè bằng --conf key=value.

spark.master                        spark://spark-master:7077

# Package tải 1 lần qua Maven vào ivy cache (volume spark-work), không tải jar tay.
# Phải khớp phiên bản: Kafka connector = đúng version Spark (3.5.8, Scala 2.12);
# delta-spark 3.3.x build cho Spark 3.5.
spark.jars.packages                 org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.8,io.delta:delta-spark_2.12:3.3.2
spark.jars.ivy                      /opt/spark/work-dir/.ivy2

# Delta Lake (dùng ở Silver)
spark.sql.extensions                io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog     org.apache.spark.sql.delta.catalog.DeltaCatalog

# HDFS mặc định: đường dẫn "/datalake/..." tự hiểu là hdfs://namenode:8020/datalake/...
spark.hadoop.fs.defaultFS           hdfs://namenode:8020
# Số bản sao do phía GHI quyết định, không phải NameNode: thiếu dòng này Spark dùng mặc định 3,
# cụm chỉ có 2 DataNode nên mọi file Spark ghi bị báo thiếu bản sao mãi.
spark.hadoop.dfs.replication        2

# Mọi thời gian trong dự án là UTC
spark.sql.session.timeZone          UTC

# Tài nguyên: worker có 4 core / 1536m cho executor. Mặc định mỗi job lấy tối đa 2 core,
# job streaming 24/7 tự giảm xuống 1 core để batch đêm vẫn còn chỗ.
spark.driver.memory                 512m
spark.executor.memory               640m
spark.executor.cores                1
spark.cores.max                     2

# Dữ liệu nhỏ (vài trăm nghìn dòng/ngày): 200 partition shuffle mặc định là quá nhiều
spark.sql.shuffle.partitions        8

# Code của repo mount ở /app (xem spark/submit.sh và service spark-worker)
spark.executorEnv.PYTHONPATH        /app
spark.sql.warehouse.dir             /opt/spark/work-dir/warehouse
